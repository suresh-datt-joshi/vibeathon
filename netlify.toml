[build]
  command = "npm run build"
  publish = "dist/public"

[build.install]
  command = "npm install"

[build.environment]
  NODE_VERSION = "20"
  NPM_CONFIG_PRODUCTION = "false"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  included_files = ["dist/**", "server/**", "shared/**", "db/**"]
  
[functions.server]
  included_files = ["dist/**", "server/**", "shared/**", "db/**"]

